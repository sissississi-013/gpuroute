<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpuroute map: where the world’s compute is</title>
<meta name="description" content="An interactive map of the world’s compute: 6,131 datacenters, frontier AI sites, undersea cables and computers in orbit, and the part of it an AI agent can actually use.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff; --ink: #0d0d0c; --mute: #77756d; --line: #d9d7cf; --card: #fbfaf7; --land: #ecebe6;
    --go: #0f7350; --sea: #2f66d6; --orbit: #ee6a2a;
    --sans: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --bar: 52px; --rail: 408px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .mute { color: var(--mute); }

  header { display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--ink); }
  .brand { font-size: 19px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
  .brand a { text-decoration: none; }
  .brand a.on { border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
  .search { position: relative; flex: 1 1 auto; max-width: 480px; }
  .search input { width: 100%; font: 14px var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 999px; padding: 8px 40px 8px 14px; }
  .search input:focus { outline: none; border-color: var(--ink); background: var(--paper); }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--mute);
                border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; pointer-events: none; }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
  .links { margin-left: auto; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .links a { text-decoration: none; }
  .links a:hover, .brand a:hover { color: var(--mute); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) var(--rail); min-height: 0; }
  .left { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  #stage { position: relative; background: var(--card); min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #cv.grabbing { cursor: grabbing; } #cv.point { cursor: pointer; }
  #chips { position: absolute; left: 12px; right: 260px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #stage.flat #chips { left: 76px; }
  .chip { font: 500 12px var(--sans); border-radius: 999px; padding: 5px 11px 5px 9px; border: 1px solid var(--line);
          background: rgba(255,255,255,.92); color: var(--mute); display: inline-flex; gap: 7px; align-items: center; }
  .chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .chip[aria-pressed="false"] .sw { opacity: .3; }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .sw.ring { background: none !important; border: 1.5px solid var(--ink); }
  .sw.dash { height: 0; width: 12px; border-radius: 0; border-top: 2px solid; background: none !important; }
  .sw.sq { border-radius: 2px; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; border: 1px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .zoom button { width: 34px; height: 32px; text-align: center; font-size: 17px; line-height: 1; }
  .zoom button + button { border-top: 1px solid var(--line); }
  .zoom button:hover { background: var(--card); }
  #key { position: absolute; right: 12px; bottom: 12px; width: 236px; display: flex; gap: 8px; align-items: flex-end; pointer-events: none; color: var(--mute); font-size: 11.5px; line-height: 1.35;
         background: rgba(251,250,247,.9); border-radius: 10px; padding: 8px 10px; }
  #key b { color: var(--ink); font-weight: 600; } #key svg { flex: none; }
  #viewseg { position: absolute; left: 12px; top: 12px; background: var(--paper); border-color: var(--ink); }
  #stage.flat #viewseg { left: 76px; }
  #tip { position: fixed; pointer-events: none; display: none; background: var(--ink); color: #fff; font-size: 12.5px;
         padding: 8px 10px; border-radius: 7px; max-width: 280px; line-height: 1.4; z-index: 20; }
  #tip b { font-weight: 600; } #tip .t2 { color: #c9c7bf; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }

  #strip { border-top: 1px solid var(--ink); padding: 10px 16px 8px; background: var(--paper); }
  .striphead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 2px; }
  .striphead h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .key { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); font-size: 12px; }
  .key i { display: inline-block; width: 16px; border-radius: 3px; }
  #clock { margin-left: auto; color: var(--mute); }
  #orbitsvg { width: 100%; display: block; }
  #orbitsvg .hit { cursor: pointer; }

  #rail { border-left: 1px solid var(--ink); overflow-y: auto; padding: 22px 22px 28px; min-height: 0; }
  #rail h1 { font-size: 40px; font-weight: 500; letter-spacing: -0.045em; line-height: .98; margin: 0 0 14px; }
  #rail h1 sup { font: 400 11px var(--mono); letter-spacing: 0; color: var(--mute); vertical-align: top; margin-left: 4px; }
  #rail h3 { font-size: 26px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; margin: 4px 0 10px; }
  .lede { color: var(--mute); font-size: 14.5px; margin: 0 0 20px; max-width: 46ch; }
  .sec { margin-top: 26px; }
  .sech { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .sech h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sech .note { color: var(--mute); font-size: 12px; }
  .access { width: 100%; border-collapse: collapse; }
  .access td:first-child { white-space: nowrap; }
  .access td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  .access tr:last-child td { border-bottom: 1px solid var(--line); }
  .access td:nth-child(2) { font-variant-numeric: tabular-nums; text-align: right; padding: 0 14px 0 8px; white-space: nowrap; }
  .access td:last-child { color: var(--mute); font-size: 13px; }
  .access .sw { margin-right: 8px; }
  .access .yes { color: var(--go); font-weight: 600; }
  .bars { display: grid; gap: 1px; }
  .barrow { display: grid; grid-template-columns: 118px minmax(0, 1fr) 58px; gap: 10px; align-items: center; width: 100%; padding: 4px 0; border-radius: 4px; }
  .barrow:hover .lab, .barrow.on .lab { text-decoration: underline; text-underline-offset: 3px; }
  .barrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barrow .trk { height: 10px; }
  .barrow .trk i { display: block; height: 100%; min-width: 2px; background: var(--ink); border-radius: 0 4px 4px 0; }
  .barrow.dim .trk i { background: #c9c7bf; }
  .barrow .val { font: 12px var(--mono); color: var(--mute); text-align: right; white-space: nowrap; }
  .share { display: flex; gap: 2px; height: 22px; } .share i { display: block; min-width: 3px; border-radius: 3px; }
  .sharekey { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13px; color: var(--mute); } .sharekey b { color: var(--ink); font-weight: 600; } .sharekey .sw { margin-right: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { font-size: 12px; padding: 3px 10px; border-radius: 999px; color: var(--mute); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .back { font-size: 13px; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin-bottom: 16px; }
  .back:hover { color: var(--ink); border-color: var(--ink); }
  .tag { font: 12px var(--mono); color: var(--mute); }
  .kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 7px 12px; margin: 14px 0; }
  .kv > :nth-child(odd) { color: var(--mute); }
  .res { display: block; width: 100%; padding: 8px 0; border-top: 1px solid var(--line); }
  .res:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .res b { font-weight: 500; } .res .mute { font-size: 13px; }
  .agentq { background: var(--ink); color: #f1f0ea; border-radius: 10px; padding: 12px; font: 12px/1.5 var(--mono); margin-top: 8px; word-break: break-word; }
  .src { color: var(--mute); font-size: 12px; margin-top: 28px; line-height: 1.5; }
  .stripplot { width: 100%; display: block; margin-top: 4px; }

  @media (max-width: 980px) {
    html, body { height: auto; } body { display: block; overflow: auto; }
    header { height: var(--bar); position: sticky; top: 0; background: var(--paper); z-index: 5; gap: 12px; }
    .links .hide-s, .search kbd { display: none; }
    main { display: block; } #stage { height: 62vh; min-height: 380px; }
    #rail { border-left: 0; border-top: 1px solid var(--ink); overflow: visible; }
    #chips, #stage.flat #chips { left: 10px; right: 10px; } #key { display: none; } #stage.flat #viewseg { left: 12px; }
  }
  @media (max-width: 560px) { .brand .sub { display: none; } #rail h1 { font-size: 34px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="./">gpuroute</a>&nbsp;&nbsp;<span class="sub">(<a href="./">Dashboard</a>/<a class="on" href="map.html" aria-current="page">Map</a>)</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search datacenters, operators, cities" autocomplete="off" aria-label="Search the map"><kbd>/</kbd></div>
  <div class="links"><a class="hide-s" href="./#start">Get started</a><span class="hide-s">, </span><a href="https://github.com/sissississi-013/gpuroute" target="_blank" rel="noopener">GitHub</a></div>
</header>
<main>
  <div class="left">
    <div id="stage">
      <canvas id="cv" role="img" aria-label="World map of compute: datacenters, frontier AI sites, undersea cables, underwater datacenters, satellites and the machines an agent can use now. The side panel lists the same data as text."></canvas>
      <div id="loading">Loading 6,131 datacenters…</div>
      <div id="chips" role="group" aria-label="Map layers"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view" style="font-size:13px">⟲</button></div>
      <div id="key"></div>
      <div class="seg" id="viewseg" role="group" aria-label="Map view"><button data-view="globe" aria-pressed="true">Globe</button><button data-view="flat" aria-pressed="false">Flat</button></div>
    </div>
    <section id="strip" aria-label="Orbital compute timeline">
      <div class="striphead">
        <h2>In orbit, next 6 hours</h2>
        <span class="key"><i style="height:10px;background:var(--orbit)"></i>compute window</span>
        <span class="key"><i style="height:5px;background:var(--ink)"></i>downlink pass over a ground station</span>
        <span class="mono" id="clock"></span>
      </div>
      <svg id="orbitsvg" height="110"></svg>
    </section>
  </div>
  <aside id="rail" aria-live="polite"></aside>
</main>
<div id="tip" role="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const C = { ink: "#0d0d0c", mute: "#77756d", line: "#d9d7cf", land: "#ecebe6", sea: "#2f66d6", orbit: "#ee6a2a", go: "#0f7350", paper: "#ffffff", card: "#fbfaf7" };
const num = (n) => Math.round(n).toLocaleString("en-US");
const power = (mw) => !mw ? "no power listed" : mw >= 1000 ? (mw / 1000).toFixed(mw >= 10000 ? 0 : 1) + " GW" : Math.round(mw) + " MW";
const hhmm = (t) => new Date(t).toISOString().slice(11, 16);
const STATIC = !["127.0.0.1", "localhost"].includes(location.hostname);
const getJSON = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.json(); });
const api = (name) => getJSON(STATIC ? `snapshot/${name}.json` : `/api/${name}`);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HERE = [-122.399, 37.786]; // where the pool's machines are drawn (San Francisco)

const LAYERS = [
  { id: "usable", label: "Usable now", color: C.go, sw: "" },
  { id: "orbit", label: "Orbit, live", color: C.orbit, sw: "" },
  { id: "frontier", label: "Frontier AI sites", color: C.ink, sw: "ring" },
  { id: "datacenters", label: "Datacenters", color: C.mute, sw: "" },
  { id: "undersea", label: "Underwater", color: C.sea, sw: "ring" },
  { id: "cables", label: "Undersea cables", color: C.sea, sw: "dash" },
  { id: "night", label: "Night side", color: "#d5d3cc", sw: "sq" },
].map((l) => ({ ...l, on: true }));
const on = (id) => LAYERS.find((l) => l.id === id).on;

let D = null, G = {}, W = 0, H = 0, DPR = 1, proj = null;
let filter = null, sel = null, hover = null, band = null, chartMode = "country";
let SKY = { sats: [], bands: [], sun: null };
const cv = $("cv"), ctx = cv.getContext("2d"), tip = $("tip");

/* ---------- astronomy: same model as gpuroute/orbital.py ---------- */
const R_EARTH = 6378.137, RAD = Math.PI / 180;
const jd = (t) => +t / 86400000 + 2440587.5;
const gmst = (j) => (((280.46061837 + 360.98564736629 * (j - 2451545.0)) % 360) + 360) % 360 * RAD;
function sunDir(j) {
  const n = j - 2451545.0, L = ((280.460 + 0.9856474 * n) % 360) * RAD, g = ((357.528 + 0.9856003 * n) % 360) * RAD;
  const lam = L + 1.915 * RAD * Math.sin(g) + 0.020 * RAD * Math.sin(2 * g), eps = (23.439 - 0.0000004 * n) * RAD;
  return [Math.cos(lam), Math.cos(eps) * Math.sin(lam), Math.sin(eps) * Math.sin(lam)];
}
function subsolar(t) {
  const j = jd(t), s = sunDir(j);
  let lon = (Math.atan2(s[1], s[0]) - gmst(j)) / RAD; lon = ((lon + 540) % 360) - 180;
  return [lon, Math.asin(s[2]) / RAD];
}
function satState(rec, t) {
  const pv = satellite.propagate(rec, new Date(t)); if (!pv.position) return null;
  const r = pv.position, j = jd(t), s = sunDir(j), dot = r.x * s[0] + r.y * s[1] + r.z * s[2], r2 = r.x * r.x + r.y * r.y + r.z * r.z;
  const th = gmst(j), x = r.x * Math.cos(th) + r.y * Math.sin(th), y = -r.x * Math.sin(th) + r.y * Math.cos(th);
  return { ecef: [x, y, r.z], sunlit: dot > 0 || Math.sqrt(Math.max(0, r2 - dot * dot)) > R_EARTH, alt: Math.sqrt(r2) - R_EARTH,
           lat: Math.atan2(r.z, Math.hypot(x, y)) / RAD, lon: Math.atan2(y, x) / RAD };
}
function elevation(st, e) {
  const la = st.lat * RAD, lo = st.lon * RAD, up = [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
  const d = [e[0] - R_EARTH * up[0], e[1] - R_EARTH * up[1], e[2] - R_EARTH * up[2]];
  return Math.asin((d[0] * up[0] + d[1] * up[1] + d[2] * up[2]) / Math.hypot(...d)) / RAD;
}
/* Sunlit windows and ground-station passes for one satellite, then the same offers orbital_offers() lists. */
function timeline(sat, now, hours = 6) {
  const STEP = 30000, end = now + hours * 3600000, sun = [], passes = [], open = {};
  let curSun = null;
  for (let t = now; t <= end; t += STEP) {
    const s = satState(sat.rec, t); if (!s) continue;
    if (s.sunlit && curSun === null) curSun = t;
    else if (!s.sunlit && curSun !== null) { sun.push([curSun, t]); curSun = null; }
    for (const st of D.market.stations) {
      const e = elevation(st, s.ecef), p = open[st.name];
      if (e >= D.market.min_elev) { if (!p) open[st.name] = { st, start: t, max: e }; else p.max = Math.max(p.max, e); }
      else if (p) { passes.push({ ...p, end: t }); delete open[st.name]; }
    }
  }
  if (curSun !== null) sun.push([curSun, end]);
  passes.sort((a, b) => a.start - b.start);
  const op = sat.op, id = sat.name.toLowerCase(), compute = [], relay = [];
  (op.needs_sun ? sun : [[now, end]]).slice(0, 4).forEach(([a, b], i) => {
    const mins = (b - a) / 60000; if (mins < 3) return;
    const nxt = passes.find((p) => p.start >= a);
    compute.push({ id: `${id}-c${i}`, a, b, mins: Math.round(mins), openNow: a <= now, price: op.usd_per_gpu_min, hardware: op.hardware,
                   power: op.needs_sun ? "solar, sunlit" : "station power", downlink: nxt ? `${nxt.st.name} at ${hhmm(nxt.start)}` : "none in window" });
  });
  passes.forEach((p, j) => relay.push({ id: j < 6 ? `${id}-r${j}` : null, a: p.start, b: p.end, station: p.st.name, max: Math.round(p.max),
                                        gb: +(p.st.mbps * (p.end - p.start) / 1000 / 8 / 1000).toFixed(1), price: p.st.usd_per_gb }));
  return { sun, compute, relay };
}

/* ---------- data ---------- */
async function load() {
  const [land, atlas, cables, epoch, undersea, orbit, market, map] = await Promise.all([
    getJSON("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json"), getJSON("static/geo/atlas.json"), getJSON("static/geo/cables.json"),
    getJSON("static/geo/epoch.json"), getJSON("static/geo/undersea.json"), getJSON("static/geo/orbit.json"),
    api("market").catch(() => ({ operators: [], stations: [], min_elev: 10 })), api("map").catch(() => [])]);
  cables.forEach((c) => { c.geo = { type: "MultiLineString", coordinates: c.g[0] && typeof c.g[0][0] === "number" ? [c.g] : c.g }; });
  epoch.sort((a, b) => b.mw - a.mw);
  const sats = orbit.map((o) => ({ ...o, rec: satellite.twoline2satrec(o.tle[1], o.tle[2]),
    op: market.operators.find((p) => p.sat === o.name) || { needs_sun: true, hardware: o.what, usd_per_gpu_min: null } }));
  const bins = d3.range(-90, 90, 5).map((lat0) => ({ lat0, lat1: lat0 + 5, n: 0, m: 0 }));
  atlas.forEach((r) => { const b = bins[Math.min(35, Math.floor((r[1] + 90) / 5))]; if (b) b.n++; });
  const mine = (Array.isArray(map) ? map : []).filter((e) => (e.kind === "this machine" || e.kind === "shared node") && e.online !== false);
  D = { land: topojson.feature(land, land.objects.land), atlas, cables, epoch, undersea, sats, market, bins, mine,
        maxMW: d3.max(epoch, (d) => d.mw) || 1, totalMW: d3.sum(epoch, (d) => d.mw), totalH100: d3.sum(epoch, (d) => d.h100e) };
  const n = atlas.length; D.ux = new Float32Array(n); D.uy = new Float32Array(n); D.uz = new Float32Array(n);
  atlas.forEach((r, i) => { const u = U(r[0], r[1]); D.ux[i] = u[0]; D.uy[i] = u[1]; D.uz[i] = u[2]; });
  [...epoch, ...undersea, ...market.stations].forEach((d) => { d.u = U(d.lon, d.lat); });
  D.here = { lon: HERE[0], lat: HERE[1], u: U(HERE[0], HERE[1]) };
  D.cablesGeo = { type: "MultiLineString", coordinates: cables.flatMap((c) => c.geo.coordinates) };
  const sl = [], sa = [], sc = [];  // points along every cable, for hover
  cables.forEach((c, ci) => c.geo.coordinates.forEach((ln) => { for (let i = 1; i < ln.length; i++) {
    const m = Math.max(1, Math.ceil(d3.geoDistance(ln[i - 1], ln[i]) / 0.012)), f = d3.geoInterpolate(ln[i - 1], ln[i]);
    for (let j = 0; j <= m; j++) { const q = f(j / m); sl.push(q[0]); sa.push(q[1]); sc.push(ci); } } }));
  D.cs = { n: sl.length, lon: sl, lat: sa, ci: sc, ux: new Float32Array(sl.length), uy: new Float32Array(sl.length), uz: new Float32Array(sl.length) };
  sl.forEach((lo, i) => { const u = U(lo, sa[i]); D.cs.ux[i] = u[0]; D.cs.uy[i] = u[1]; D.cs.uz[i] = u[2]; });

      <div class="kv"><div>now</div><div>${Math.round(s.now.alt)} km up, over ${Math.abs(s.now.lat).toFixed(1)}°${s.now.lat >= 0 ? "N" : "S"} ${Math.abs(s.now.lon).toFixed(1)}°${s.now.lon >= 0 ? "E" : "W"}, ${s.now.sunlit ? "sunlit" : "in Earth’s shadow"}</div>
        <div>hardware</div><div>${esc(d.what)}</div><div>power</div><div>${d.op.needs_sun ? "solar: computes only while sunlit" : "station power: always on"}</div></div>
      <div class="sec"><div class="sech"><h2>Compute windows</h2></div>${tl.compute.map((c) => `<div class="res"><b>${win(c)}</b>${c.openNow ? " · open now" : ""}<div class="mute">${c.mins} min${c.price != null ? ` · $${c.price}/GPU-min` : ""} · downlink ${esc(c.downlink)}</div><div class="mono mute">${c.id}</div></div>`).join("") || `<p class="mute">No window in the next 6 hours.</p>`}</div>
      <div class="sec"><div class="sech"><h2>Downlink passes</h2></div>${tl.relay.slice(0, 6).map((r) => `<div class="res"><b>${esc(r.station)}</b> · ${win(r)}<div class="mute">${r.gb} GB · ${r.max}° max elevation · $${r.price}/GB</div></div>`).join("") || `<p class="mute">No pass in the next 6 hours.</p>`}</div>
      <p class="mute" style="font-size:12.5px">Orbits, sunlight and passes are computed from real orbital elements. Operator listings and prices are mock, and booked jobs are emulated on ground GPUs.</p>
      ${agentQ(tl.compute[0] ? `book_orbital("${tl.compute[0].id}", "benchmark.py", budget_usd=1)` : "orbital_offers()")}`;
  }
  return "";
}
function renderRail() { const r = $("rail"); r.innerHTML = sel ? itemView() : filter ? filterView() : overview(); r.scrollTop = 0; }
$("rail").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return; const ds = b.dataset;
  if ("clear" in ds) { setFilter(null); $("zreset").click(); }
  else if ("back" in ds) { sel = null; renderRail(); render(); }
  else if (ds.mode) { chartMode = ds.mode; renderRail(); }
  else if (ds.owner) setFilter({ type: "owner", value: ds.owner, label: ds.owner });
  else if (ds.country) setFilter({ type: "country", value: ds.country, label: ds.country });
  else if (ds.operator) setFilter({ type: "operator", value: ds.operator, label: ds.operator });
  else if (ds.dc) select({ kind: "dc", i: +ds.dc, d: D.atlas[+ds.dc] });
  else if (ds.fr) select({ kind: "frontier", d: D.epoch[+ds.fr] });
});

/* ---------- chips, size key ---------- */
function renderChips() {
  $("chips").innerHTML = LAYERS.map((l) => `<button class="chip" data-layer="${l.id}" aria-pressed="${l.on}"><span class="sw ${l.sw}" style="background:${l.color};border-color:${l.color}"></span>${l.label}</button>`).join("");
}
$("chips").addEventListener("click", (ev) => { const b = ev.target.closest("[data-layer]"); if (!b) return; const l = LAYERS.find((x) => x.id === b.dataset.layer); l.on = !l.on; renderChips(); render(); });
function drawKey() {
  const h = Math.min($("stage").clientHeight * .2, 110) * 300 / D.maxMW, globe = V.mode === "globe";
  $("key").innerHTML = `<svg width="22" height="${Math.ceil(h) + 4}" aria-hidden="true"><path d="M7.6 ${h + 2}L11 2l3.4 ${h}z" fill="rgba(13,13,12,.16)" stroke="${C.ink}" stroke-width="1.1" stroke-linejoin="round"/></svg>
    <div><b>300 MW</b> of frontier AI power, at full view.<br>${globe ? "Dark side is night right now; datacenters there are lit. Satellites fly at true altitude." : "Shaded side is night right now; datacenters there are lit."}</div>`;
}

/* ---------- orbit timeline ---------- */
function drawStrip() {
  const svg = $("orbitsvg"), w = svg.clientWidth || 600, LW = w < 520 ? 96 : 168, x0 = LW, x1 = w - 8, rowH = 40, top = 20;
  if (!SKY.sats.length) return;
  const now = SKY.sats[0].built, x = (t) => x0 + (x1 - x0) * (t - now) / (6 * 3600000), h = top + rowH * SKY.sats.length + 2;
  svg.setAttribute("height", h); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  let out = "";
  for (let t = Math.ceil(now / 3600000) * 3600000; t <= now + 6 * 3600000; t += 3600000) {
    out += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 4}" y2="${h}" stroke="${C.line}"/>`;
    if (x(t) - x0 > 34) out += `<text x="${x(t)}" y="11" font-size="10" fill="${C.mute}" text-anchor="middle" font-family="JetBrains Mono, monospace">${hhmm(t)}</text>`;
  }
  out += `<text x="${x0}" y="11" font-size="10" fill="${C.ink}" font-family="JetBrains Mono, monospace">now</text><line x1="${x0}" x2="${x0}" y1="${top - 4}" y2="${h}" stroke="${C.ink}"/>`;
  SKY.sats.forEach((s, i) => {
    const y = top + i * rowH, st = s.now || {};
    out += `<g class="hit" data-sat="${i}"><rect x="0" y="${y}" width="${LW - 6}" height="${rowH}" fill="transparent"/>
      <text x="0" y="${y + 16}" font-size="13" font-weight="600" fill="${C.ink}">${esc(s.sat.name)}</text>
      <text x="0" y="${y + 31}" font-size="11" fill="${C.mute}">${st.alt ? Math.round(st.alt) + " km · " + (st.sunlit ? "sunlit" : "in shadow") : ""}</text></g>`;
    if (i) out += `<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="${C.line}"/>`;
    s.tl.compute.forEach((c, j) => { out += `<rect class="hit" data-sat="${i}" data-c="${j}" x="${x(c.a) + (c.openNow ? 0 : 1)}" y="${y + 7}" width="${Math.max(2, x(c.b) - x(c.a) - 2)}" height="12" rx="4" fill="${C.orbit}"/>`; });
    s.tl.relay.forEach((r, j) => { out += `<rect class="hit" data-sat="${i}" data-r="${j}" x="${x(r.a) - 1}" y="${y + 24}" width="${Math.max(4, x(r.b) - x(r.a))}" height="6" rx="3" fill="${C.ink}"/><rect class="hit" data-sat="${i}" data-r="${j}" x="${x(r.a) - 5}" y="${y + 20}" width="${Math.max(12, x(r.b) - x(r.a) + 8)}" height="16" fill="transparent"/>`; });
  });
  svg.innerHTML = out;
}
$("orbitsvg").addEventListener("mousemove", (ev) => {
  const g = ev.target.closest("[data-sat]"); if (!g) return hideTip();
  const s = SKY.sats[+g.dataset.sat], win = (o) => `${hhmm(o.a)}–${hhmm(o.b)} UTC`;
  if (g.dataset.c != null) { const c = s.tl.compute[+g.dataset.c]; showTip(`<b>${esc(s.sat.name)} compute</b> · ${win(c)}<br><span class="t2">${c.mins} min · ${esc(c.power)}${c.price != null ? ` · $${c.price}/GPU-min` : ""}<br>downlink: ${esc(c.downlink)}</span>`, ev); }
  else if (g.dataset.r != null) { const r = s.tl.relay[+g.dataset.r]; showTip(`<b>${esc(r.station)}</b> · ${win(r)}<br><span class="t2">${r.gb} GB down · ${r.max}° max elevation · $${r.price}/GB</span>`, ev); }
  else showTip(`<b>${esc(s.sat.name)}</b><br><span class="t2">${esc(s.sat.what)}</span>`, ev);
});
$("orbitsvg").addEventListener("mouseleave", hideTip);
$("orbitsvg").addEventListener("click", (ev) => { const g = ev.target.closest("[data-sat]"); if (g) select({ kind: "sat", d: SKY.sats[+g.dataset.sat].sat }); });

/* ---------- search + keys ---------- */
let searchT = null;
$("q").addEventListener("input", (ev) => { clearTimeout(searchT); searchT = setTimeout(() => {
  const v = ev.target.value.trim().toLowerCase(); if (v.length < 2) { if (filter) { setFilter(null); $("zreset").click(); } return; }
  setFilter({ type: "search", value: v, label: v });
}, 220); });
addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement !== $("q")) { ev.preventDefault(); $("q").focus(); }
  if (ev.key === "Escape") { if (sel) { sel = null; renderRail(); render(); } else if (filter) { setFilter(null); $("zreset").click(); } $("q").blur(); }
});

/* ---------- go ---------- */
load().then(async () => {
  D.undersea.forEach((d) => { d.short = d.name.split(" (")[0].replace(/ (undersea |underwater )?data center/i, ""); });
  $("loading").remove(); renderChips(); d3.select(cv).call(zoom).on("dblclick.zoom", null);
  document.querySelectorAll("#viewseg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === V.mode));
  if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1200))]);
  rebuild(); renderRail(); requestAnimationFrame(loop);
  const q0 = new URLSearchParams(location.search).get("q");
  if (q0 && q0.trim().length >= 2) { $("q").value = q0; setFilter({ type: "search", value: q0.trim().toLowerCase(), label: q0.trim().toLowerCase() }); }
  let rz = null; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if ($("stage").clientWidth !== W || $("stage").clientHeight !== H) rebuild(); }, 120); }).observe($("stage"));
  setInterval(tick, 1000);
  setInterval(() => { updateSky(); drawStrip(); if (sel && sel.kind === "sat") renderRail(); }, 30000);
}).catch((e) => { $("loading").textContent = "Couldn’t load the map data. Check your connection and reload."; console.error(e); });
</script>
