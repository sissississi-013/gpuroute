[project]
name = "gpuroute"
version = "0.1.0"
description = "Size, price and launch GPU training jobs for AI agents, with a hard budget cap."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13", "mcp>=2"]

[project.optional-dependencies]
local = ["torch", "transformers", "peft", "datasets", "accelerate"]

[project.scripts]
gpuroute = "gpuroute.cli:main"
gpuroute-mcp = "gpuroute.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
